[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jssh"
version = "0.1.0"
description = "JumpServer 2.4.1 SSH/SFTP asset picker for the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jssh contributors" }]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "pexpect>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jssh = "jssh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
